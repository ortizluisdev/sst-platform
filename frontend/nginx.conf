# Sirve el SPA de Vue — el nginx del sistema (fuera de este contenedor)
# sigue siendo quien termina SSL y decide qué va a este contenedor vs. al
# backend; este nginx interno solo necesita el try_files típico de SPA.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
